[package]
name = "liana-gui"
version = "16.1.0"
readme = "README.md"
description = "Liana GUI"
repository = "https://github.com/wizardsardine/liana"
license = "BSD-3-Clause"
authors = ["Edouard Paris <m@edouard.paris>"]
edition = "2018"
resolver = "2"

[package.metadata.winresource]
LegalCopyright = "Copyright © 2025"

[[bin]]
name = "liana-gui"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
async-hwi = { workspace = true }
liana = { path = "../liana" }
liana-connect = { workspace = true }
liana-i18n = { workspace = true }
lianad = { path = "../lianad", default-features = false, features = ["nonblocking_shutdown"] }
liana-ui = { path = "../liana-ui" }
backtrace = { workspace = true }
hex = { workspace = true }

iced = { workspace = true, default-features = false, features = ["tokio", "svg", "qr_code", "image", "lazy", "wgpu", "advanced", "tiny-skia", "x11", "wayland"] }
iced_aw = { workspace = true, features = ["context_menu"] }
iced_runtime = { workspace = true }

# Used to verify RFC-compliance of an email
email_address = { workspace = true }

# "net", "time" and "io-util" serve the loopback end of the 21st Capital key handoff.
tokio = { workspace = true, features = ["signal", "net", "time", "io-util"] }
async-fd-lock = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Used to ping bitcoind node
jsonrpc = { workspace = true, features = ["simple_http"], default-features = false }

# Logging stuff
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
log = { workspace = true }

dirs = { workspace = true }
toml = { workspace = true }

chrono = { workspace = true }

# Used for managing internal bitcoind
libc = { workspace = true }
base64 = { workspace = true }
bitcoin_hashes = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { workspace = true, features = ["ring"] }
rust-ini = { workspace = true }
rfd = { workspace = true }
fs2 = { workspace = true }

# Used for opening URLs in browser
open = { workspace = true }

bip138 = { workspace = true }

[target.'cfg(windows)'.dependencies]
zip = { workspace = true, default-features = false, features = ["bzip2", "deflate"] }

[target.'cfg(unix)'.dependencies]
tar = { workspace = true, default-features = false }
flate2 = { workspace = true, default-features = false }

# Talia Desktop: reading a vault's QR code with the Mac's camera (decided
# 2026-11-15). Apple's AVFoundation films and Apple's Vision reads the codes,
# through the objc2 bindings the window system already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSDictionary", "NSValue", "NSError", "NSObject"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "alloc", "objc2"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-video", "VNRequest", "VNDetectBarcodesRequest", "VNRequestHandler", "VNObservation", "VNTypes"] }

# Hands a picture to the camera reader's tests as the camera does.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = ["debugger"]
debugger = []
skip-windows-icon = []

[build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
liana = { path = "../liana", features = ["test-utils"] }
# Draws QR codes for the camera reader's tests (already in the build through iced).
qrcode = { version = "=0.13.0", default-features = false }
tokio = {workspace = true, features = ["rt", "macros"]}
